name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: eajmusic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d eajmusic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:synthetic-ci-only@127.0.0.1:5432/eajmusic_test
      EAJ_TEST_DATABASE_URL: postgresql://audit:synthetic-ci-only@127.0.0.1:5432/eajmusic_test
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to isolated test database
        run: npx prisma migrate deploy

      - name: Run behavioral and isolated database tests
        run: npm test
